name: build

# The pipeline that runs on every push and pull request. Its job is signal, not shipping:
#
#   tests    - the platform-independent logic, fast and never flaky
#   android  - a real Release APK; Android builds on Linux, so this is the strongest signal
#   ios      - compiles on macOS. A device .ipa is a release-pipeline concern (release.yml),
#              because it needs Apple signing material that must not be needed to see whether
#              the code still compiles.
#
# The Android job also uploads an installable APK, so a build can be put on a phone without a
# local toolchain. release.yml is the one that produces the released artifacts.

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/IBEBarcode.Scanner/IBEBarcode.Scanner.csproj

jobs:
  tests:
    name: Build and test (core logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The core library has no platform dependency, so its tests run anywhere and fast.
      - name: Test
        run: dotnet test tests/IBEBarcode.Scanner.Core.Tests --configuration Release

      # The artifact budget's own tests: they pin the guard's verdicts and assert
      # that every upload in both workflows is measured before it stores anything,
      # which is the part that keeps a new upload from arriving unbudgeted. PyYAML
      # reads the workflow files; the image normally has it, and installing it is
      # cheaper than skipping the wiring check.
      - name: Test the artifact budget guard
        run: |
          python3 -c 'import yaml' || pip3 install --quiet pyyaml
          bash scripts/artifact-budget.test.sh

  android:
    name: Android build
    runs-on: ubuntu-latest
    env:
      # The secrets context is not available to a step's `if`, so whether the release keystore
      # exists is decided once here and read back as an environment variable.
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # maui-android (not the full maui workload): the monolithic maui is not installable on
      # Linux. The app project is built with -p:AndroidOnly=true below so it never evaluates
      # the iOS target, which would demand the iOS workload manifest this OS cannot install.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # If the release keystore is configured, use it even for a push build: APKs signed with the
      # same key install over each other, while each runner gets a fresh debug keystore, so
      # debug-signed push builds would all have to be uninstalled first. Forks and pull requests
      # have no secrets, in which case this falls back to the debug key with a warning.
      - name: Unpack the signing key
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ibe.keystore"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/storepass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/keypass"

      - name: Publish
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          args=(
            -f net10.0-android
            -p:AndroidOnly=true
            -c Release
            -o dist
            -p:AndroidPackageFormat=apk
            -p:ApplicationVersion=${{ github.run_number }}
          )
          if [ "$HAS_ANDROID_KEYSTORE" = "true" ]; then
            echo "Signing with the release keystore, alias '$KEY_ALIAS'."
            args+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/ibe.keystore"
              -p:AndroidSigningKeyAlias="$KEY_ALIAS"
              -p:AndroidSigningKeyPass="file:$RUNNER_TEMP/keypass"
              -p:AndroidSigningStorePass="file:$RUNNER_TEMP/storepass"
            )
          else
            echo "::warning title=Debug signing key::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with the runner's own debug key. It installs, but not over any build signed with a different key."
          fi
          dotnet publish "$PROJECT" "${args[@]}"
          mv dist/*-Signed.apk "ibe-barcode-scanner-${{ github.sha }}.apk"

      # Artifact storage is one 500 MB meter for the whole account, not a quota per
      # repository (see the header of `scripts/artifact-budget.mjs`): a sibling
      # repository's 436.8 MB desktop build per run is what spent it, and this
      # APK went unstoreable for weeks as a result. So the upload below is
      # measured first. A fifth of the month is 100 MiB, which a 51.8 MB APK fits
      # inside with room — this is not meant to stop a normal build, it is meant
      # to catch the build that starts packing something unexpected, and to keep
      # this repository from being the one that refills the meter quietly.
      #
      # Only an over-budget verdict (exit 1) is downgraded to a warning. A usage
      # error still fails the job, because a guard that cannot measure must not
      # read as "inside the budget".
      - name: Check the artifact budget
        id: budget
        run: |
          set -euo pipefail
          status=0
          node scripts/artifact-budget.mjs \
            --label android-apk \
            --budget-mb 100 \
            --retention-days 14 \
            "ibe-barcode-scanner-*.apk" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning title=Artifact budget::The APK was not stored: it is over this run's 100 MiB share of the account's artifact allowance."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        if: steps.budget.outputs.over-budget != 'true'
        with:
          name: android-apk
          if-no-files-found: error
          # Long enough to be useful, short enough not to pile up: release.yml keeps the ones
          # that are meant to be kept.
          retention-days: 14
          path: ibe-barcode-scanner-*.apk

  ios:
    name: iOS build
    # The Xcode 27 image, not macos-26: the .NET for iOS workload must resolve the same SDK
    # band NuGet serves CI (currently 27.0), and that band hard-requires Xcode 27. The macos-26
    # image tops out at Xcode 26.6 and fails with "requires Xcode 27". Revisit when the dev
    # machine's 26.5 band is retired.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      # Simulator build, so no signing material is needed, and the C# and XAML are compiled the
      # same way a device build compiles them. If this ever fails with actool reporting "No
      # simulator runtime version ... available to use with iphonesimulator SDK version ...", the
      # image is missing the runtime: see the workaround in release.yml
      # (IOS_DOWNLOAD_SIMULATOR_RUNTIME) and docs/testing/packaging-and-ci.md.
      - name: Build
        run: dotnet build src/IBEBarcode.Scanner/IBEBarcode.Scanner.csproj -f net10.0-ios --configuration Release -p:RuntimeIdentifier=iossimulator-arm64
